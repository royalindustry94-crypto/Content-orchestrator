# Staging / full-stack local compose.
# Usage (from repo root, with a filled .env):
#   docker compose -f docker-compose.staging.yml up --build
#
# Dev-only Postgres remains in docker-compose.yml (no app images).

services:
  secrets-check:
    image: alpine:3.21
    restart: "no"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the staging environment}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?Set APP_RUNTIME_PASSWORD in the staging environment}
    volumes:
      - ./scripts/validate_staging_secrets.sh:/validate_staging_secrets.sh:ro
    command: ["sh", "/validate_staging_secrets.sh"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the staging environment}
      POSTGRES_DB: content_orchestrator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      secrets-check:
        condition: service_completed_successfully

  database-bootstrap:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the staging environment}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?Set APP_RUNTIME_PASSWORD in the staging environment}
    volumes:
      - ./scripts/bootstrap_local_postgres.sql:/bootstrap_local_postgres.sql:ro
    command:
      - sh
      - -ec
      - >-
        psql -h postgres -U postgres -d content_orchestrator
        -v ON_ERROR_STOP=1
        -v app_runtime_password="$$APP_RUNTIME_PASSWORD"
        -f /bootstrap_local_postgres.sql
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Compose network hostnames override local .env localhost URLs.
      DATABASE_URL: ${STAGING_DATABASE_URL:?Set STAGING_DATABASE_URL with the postgres service hostname}
      APP_DATABASE_URL: ${STAGING_APP_DATABASE_URL:?Set STAGING_APP_DATABASE_URL with the app_runtime credentials}
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      RUN_MIGRATIONS: "1"
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-["http://localhost:8080"]}
    depends_on:
      postgres:
        condition: service_healthy
      database-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${STAGING_DATABASE_URL:?Set STAGING_DATABASE_URL with the postgres service hostname}
      API_BASE_URL: http://api:8000
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      HEALTH_CHECK_INTERVAL_SECONDS: ${HEALTH_CHECK_INTERVAL_SECONDS:-300}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-10}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
