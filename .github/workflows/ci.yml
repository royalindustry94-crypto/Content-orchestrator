name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: content_orchestrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/content_orchestrator_test
      APP_DATABASE_URL: postgresql://app_runtime:app_runtime@localhost:5432/content_orchestrator_test
      SUPABASE_JWT_SECRET: ci-test-supabase-jwt-secret
      ENVIRONMENT: test
      AUTH_MODE: local
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run migrations
        run: alembic upgrade head
      - name: Migration replay
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Lint
        run: ruff check .
      - name: Test with coverage gate
        run: pytest --cov=app --cov-fail-under=75

  worker:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/content_orchestrator_test
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck + build
        run: npm run build
      # Known high findings in eslint/vite transitive tree; fail-closed once deps are patched.
      # Until then report but do not block the pipeline.
      - name: npm audit (high+)
        continue-on-error: true
        run: npm audit --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API package (for dependency graph)
        working-directory: apps/api
        run: pip install -e .
      - name: pip-audit (API)
        # Existing transitive CVEs (starlette/pyjwt/jinja2/etc.) make
        # fail-on-high too noisy until pins are upgraded. This step fails
        # the job only if pip-audit itself errors; findings are still logged.
        # Tighten to fail on high once the dependency baseline is clean.
        working-directory: apps/api
        run: |
          pip install pip-audit
          pip-audit || {
            status=$?
            echo "pip-audit exited with status ${status} (vulnerability findings are expected until deps are upgraded)."
            if [ "$status" -gt 1 ]; then
              echo "pip-audit tool failure — failing the job."
              exit "$status"
            fi
            exit 0
          }

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t content-orchestrator-api:ci ./apps/api
      - name: Build worker image
        run: docker build -t content-orchestrator-worker:ci ./apps/worker
      - name: Build web image
        run: docker build -t content-orchestrator-web:ci ./apps/web
