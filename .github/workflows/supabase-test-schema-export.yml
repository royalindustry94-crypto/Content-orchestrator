name: Supabase test schema export

on:
  push:
    branches: [ops/supabase-test-schema-export]

permissions:
  contents: write

jobs:
  export-schema:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/content_orchestrator_offline
      APP_DATABASE_URL: postgresql://app_runtime:app_runtime@localhost:5432/content_orchestrator_offline
      SUPABASE_JWT_SECRET: offline-schema-export-only
      ENVIRONMENT: test
      AUTH_MODE: local
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/supabase-test-schema-export
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Generate exact Alembic offline SQL
        run: |
          set -euo pipefail
          alembic upgrade head --sql > schema.sql
          test -s schema.sql
          grep -q "alembic_version" schema.sql
      - name: Sanitize and split managed-test SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('schema.sql').read_text()
          src = re.sub(r'^BEGIN;\s*', '', src, count=1)
          src = re.sub(r'\s*COMMIT;\s*$', '\n', src, count=1)
          src = src.replace(
              "CREATE ROLE app_runtime LOGIN PASSWORD 'app_runtime' NOBYPASSRLS NOCREATEROLE NOCREATEDB;",
              "CREATE ROLE app_runtime NOLOGIN NOBYPASSRLS NOCREATEROLE NOCREATEDB;",
          )
          if "PASSWORD 'app_runtime'" in src:
              raise SystemExit('static app_runtime password remains')
          if 'CREATE ROLE app_runtime NOLOGIN' not in src:
              raise SystemExit('sanitized app_runtime role not found')

          blocks = re.split(r'(?=-- Running upgrade )', src)
          prefix = blocks.pop(0)
          if prefix.strip():
              blocks[0] = prefix + blocks[0]

          out = Path('../../database/supabase_test_bootstrap')
          out.mkdir(parents=True, exist_ok=True)
          for old in out.glob('part_*.sql'):
              old.unlink()

          max_bytes = 28000
          chunks = []
          current = ''
          for block in blocks:
              candidate = current + block
              if current and len(candidate.encode()) > max_bytes:
                  chunks.append(current)
                  current = block
              else:
                  current = candidate
          if current:
              chunks.append(current)

          for idx, chunk in enumerate(chunks, 1):
              (out / f'part_{idx:02d}.sql').write_text(chunk)

          manifest = '\n'.join(
              f'part_{idx:02d}.sql {len(chunk.encode())} bytes'
              for idx, chunk in enumerate(chunks, 1)
          ) + '\n'
          (out / 'MANIFEST.txt').write_text(manifest)
          print(manifest)
          PY
      - name: Commit sanitized chunks to temporary branch
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add database/supabase_test_bootstrap
          git diff --cached --quiet && exit 0
          git commit -m "ops: generated sanitized Supabase bootstrap chunks [skip ci]"
          git push origin HEAD:ops/supabase-test-schema-export
      - name: Upload raw schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-test-schema-${{ github.sha }}
          path: apps/api/schema.sql
          if-no-files-found: error
          retention-days: 1
