name: Supabase audited schema export

on:
  push:
    branches: [ops/supabase-test-apply-4e953c5]

permissions:
  contents: write

jobs:
  export-schema:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    env:
      AUDITED_SHA: 4e953c5428873353806b62d9f0c8ed05844ec721
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/content_orchestrator_offline
      APP_DATABASE_URL: postgresql://app_runtime:app_runtime@localhost:5432/content_orchestrator_offline
      SUPABASE_JWT_SECRET: offline-schema-export-only
      ENVIRONMENT: test
      AUTH_MODE: local
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/supabase-test-apply-4e953c5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify audited migration inputs are unchanged
        working-directory: .
        run: |
          set -euo pipefail
          git cat-file -e "$AUDITED_SHA^{commit}"
          git diff --exit-code "$AUDITED_SHA" -- apps/api/alembic apps/api/alembic.ini scripts/bootstrap_local_postgres.sql
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Generate exact Alembic offline SQL
        run: |
          set -euo pipefail
          alembic upgrade head --sql > schema.sql
          test -s schema.sql
          grep -q "alembic_version" schema.sql
      - name: Validate and split exact managed-test SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          audited_sha = "4e953c5428873353806b62d9f0c8ed05844ec721"
          raw = Path("schema.sql").read_text()

          forbidden = {
              "create auth schema": r"CREATE\s+SCHEMA(?:\s+IF\s+NOT\s+EXISTS)?\s+auth\b",
              "create auth.users": r"CREATE\s+TABLE(?:\s+IF\s+NOT\s+EXISTS)?\s+auth\.users\b",
              "alter auth.users": r"ALTER\s+TABLE\s+auth\.users\b",
              "drop auth.users": r"DROP\s+TABLE(?:\s+IF\s+EXISTS)?\s+auth\.users\b",
              "drop auth schema": r"DROP\s+SCHEMA(?:\s+IF\s+EXISTS)?\s+auth\b",
              "app_runtime password literal": r"PASSWORD\s+'app_runtime'",
          }
          for label, pattern in forbidden.items():
              if re.search(pattern, raw, flags=re.IGNORECASE):
                  raise SystemExit(f"forbidden SQL found: {label}")

          if "content_orchestrator_on_auth_user_created" not in raw:
              raise SystemExit("expected namespaced auth trigger missing")
          if "CREATE ROLE app_runtime NOLOGIN NOBYPASSRLS NOCREATEROLE NOCREATEDB" not in raw:
              raise SystemExit("expected managed-safe app_runtime role missing")
          if "auth.users is required" not in raw:
              raise SystemExit("expected fail-closed auth.users precondition missing")

          src = re.sub(r"^BEGIN;\s*", "", raw, count=1)
          src = re.sub(r"\s*COMMIT;\s*$", "\n", src, count=1)

          blocks = re.split(r"(?=-- Running upgrade )", src)
          prefix = blocks.pop(0)
          if not blocks:
              raise SystemExit("no Alembic upgrade blocks found")
          if prefix.strip():
              blocks[0] = prefix + blocks[0]

          out = Path("../../database/supabase_audited_apply_4e953c5")
          out.mkdir(parents=True, exist_ok=True)
          for old in out.glob("part_*.sql"):
              old.unlink()

          max_bytes = 26000
          chunks = []
          current = ""
          for block in blocks:
              candidate = current + block
              if current and len(candidate.encode()) > max_bytes:
                  chunks.append(current)
                  current = block
              else:
                  current = candidate
          if current:
              chunks.append(current)

          manifest_lines = [
              f"audited_sha {audited_sha}",
              f"raw_sha256 {hashlib.sha256(raw.encode()).hexdigest()}",
              f"chunk_count {len(chunks)}",
          ]
          for idx, chunk in enumerate(chunks, 1):
              path = out / f"part_{idx:02d}.sql"
              path.write_text(chunk)
              manifest_lines.append(
                  f"part_{idx:02d}.sql {len(chunk.encode())} bytes sha256 {hashlib.sha256(chunk.encode()).hexdigest()}"
              )

          (out / "MANIFEST.txt").write_text("\n".join(manifest_lines) + "\n")
          print("\n".join(manifest_lines))
          PY
      - name: Commit exact SQL chunks to disposable branch
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add database/supabase_audited_apply_4e953c5
          git diff --cached --quiet && exit 0
          git commit -m "ops: generated exact audited Supabase SQL chunks [skip ci]"
          git push origin HEAD:ops/supabase-test-apply-4e953c5
      - name: Upload raw schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-audited-schema-4e953c5-${{ github.sha }}
          path: apps/api/schema.sql
          if-no-files-found: error
          retention-days: 1
